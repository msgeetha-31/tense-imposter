const SECT={A:"Present tenses (Q1–10)",B:"Past tenses (Q11–20)",C:"Future tenses (Q21–30)",ALL:"All tenses (Q1–30)"};

let uid=null,code=null,myName="",gref=null,G=null,roleSeen=false,lastKey="",lastPh="";
const app=$("#app");
const KEY="impStudent";
function saveSess(){try{localStorage.setItem(KEY,JSON.stringify({code,name:myName}));}catch(e){}}
function loadSess(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
function clearSess(){try{localStorage.removeItem(KEY);}catch(e){}}

function startScreen(msg){
  if(gref){gref.off();gref=null;}G=null;lastKey="";
  const s=loadSess()||{};
  app.innerHTML=`<div class="card center fade">
   <div class="rocket">🚀</div>
   <h1>Tense Imposter</h1><div class="zh">时态卧底 · 太空任务</div>
   <p>Answer tense questions with your crew. But watch out: someone has <b style="color:var(--imp)">fake hints</b> and is trying to trick everyone!</p>
   <p class="zh">和队员一起回答时态题。小心！卧底拿到的是假提示，想骗大家答错。</p>
   <div style="text-align:left;max-width:360px;margin:0 auto">
    <label>Your name 名字</label><input id="nm" maxlength="20" value="${esc(s.name||"")}" placeholder="e.g. Aina">
    <label>Game code 游戏代码</label><input id="cd" inputmode="numeric" maxlength="6" value="${esc(new URLSearchParams(location.search).get("code")||"")}" placeholder="6 digits">
    <div style="margin-top:14px"><button class="btn teal" id="go" style="width:100%">Board the ship 登船</button></div>
    <div class="err" id="er">${esc(msg||"")}</div>
   </div></div>`;
  $("#go").onclick=join;
  $("#cd").addEventListener("keydown",e=>{if(e.key==="Enter")join();});
}
async function join(){
  const nm=$("#nm").value.trim().replace(/\s+/g," "),cd=$("#cd").value.trim();
  const er=$("#er");er.textContent="";
  if(!nm){er.textContent="Please type your name. 请输入名字。";return;}
  if(!/^\d{6}$/.test(cd)){er.textContent="The code has 6 digits. 代码是6位数字。";return;}
  $("#go").disabled=true;$("#go").textContent="Connecting…";
  try{
    uid=await freshAuth(false);
    const g=(await withAuth(()=>DB.ref("imp/"+cd).get())).val();
    if(!g||!g.owner){throw new Error("No game with this code. 找不到这个游戏。");}
    if(g.status==="end"){throw new Error("This game has ended. 游戏已结束。");}
    await withAuth(()=>DB.ref("imp/"+cd+"/players/"+AUTH.currentUser.uid).update({name:nm,at:TS}));
    uid=AUTH.currentUser.uid;code=cd;myName=nm;saveSess();snd("ok");watch();
  }catch(e){er.textContent=e.message||String(e);$("#go").disabled=false;$("#go").textContent="Board the ship 登船";}
}
function watch(){
  gref=DB.ref("imp/"+code);
  gref.on("value",s=>{G=norm(s.val());
    if(!G){clearSess();startScreen("The teacher closed this game. 老师已关闭游戏。");return;}
    if(!G.players||!G.players[uid]){clearSess();startScreen("You were removed from the game. 你已被移出游戏。");return;}
    render();});
}
const me=()=>G.players[uid]||{};
const myRole=()=>(G.roles||{})[uid];
const isOut=id=>G.out&&G.out[id]!=null;
const pname=id=>(G.players&&G.players[id]?G.players[id].name:"(left)");
function curQ(){return QS[G.cfg.qs[G.st.r]];}
function vE(){return G.cfg.vE||1;}
function voteDue(r){return (r+1)%vE()===0||r+1>=G.cfg.rounds;}
function nextVoteQ(r){return Math.min(G.cfg.rounds,Math.ceil((r+1)/vE())*vE());}

function roleChip(){
  const r=myRole();if(!r)return `<span class="chip">⏳ Getting role…</span>`;
  return `<span class="chip" id="chip" data-r="${r}">🔒 Hold to see role 按住看身份</span>`;
}
function bindChip(){
  const c=$("#chip");if(!c)return;const r=c.dataset.r;
  const show=e=>{e.preventDefault();c.className="chip "+(r==="I"?"imp":"crew");c.textContent=r==="I"?"🔪 IMPOSTER 卧底":"👨‍🚀 CREW 队员";};
  const hide=()=>{c.className="chip";c.textContent="🔒 Hold to see role 按住看身份";};
  c.addEventListener("pointerdown",show);["pointerup","pointerleave","pointercancel"].forEach(ev=>c.addEventListener(ev,hide));
  c.addEventListener("contextmenu",e=>e.preventDefault());
}
function header(){
  const st=G.st,n=G.cfg.rounds,sab=st.sab||0;
  return `<div class="top"><b>Round ${st.r+1}/${n}</b>
   <span class="pill">Sabotage 破坏 <span class="meter">${[0,1,2].map(i=>`<i class="${i<sab?"on":""}"></i>`).join("")}</span></span>
   <span class="pill">🗳️ Vote after Q${nextVoteQ(st.r)}</span>
   <span class="sp"></span><span class="timer" id="tm"></span></div>
   <div class="row" style="margin-top:8px">${roleChip()}<span class="sp"></span><span class="muted">${esc(myName)}</span></div>
   ${isOut(uid)?`<div class="ghostbar">👻 You were ejected. Keep answering for practice, but you can't vote. 你已被淘汰，可以继续练习，但不能投票。</div>`:""}`;
}

function render(){
  const st=G.st||{};
  const key=[G.status,st.r,st.ph,st.reveal,isOut(uid),myRole()].join("|");
  if(G.status==="lobby"){renderLobby();return;}
  if(G.status==="live"&&myRole()&&!roleSeen){roleSeen=true;showRoleCard();}
  if(key!==lastKey){lastKey=key;
    if(st.ph!==lastPh||G.status==="end"&&lastPh!=="END"){
      if(G.status==="end"){lastPh="END";}
      else{if(st.ph==="vote")snd("alarm");if(st.ph==="eject"&&st.ej)snd("eject");if(st.ph==="q"&&lastPh)snd("tap");lastPh=st.ph;}}
    if(G.status==="end"){renderEnd();return;}
    if(st.ph==="q")renderQ();else if(st.ph==="result")renderResult();else if(st.ph==="vote")renderVote();else if(st.ph==="eject")renderEject();
    bindChip();
  }else{
    // same screen: refresh small live parts
    if(st.ph==="q")markSel();
    if(st.ph==="vote")markVote();
    if(G.status==="lobby")renderLobby();
  }
}
function renderLobby(){
  const ps=Object.values(G.players||{}).map(p=>p.name);

   <div class="zh">已登船，等待老师开始</div>

     <li>See who chose what. Every 3 questions there is an emergency meeting: <b>vote</b> out the person you think is the imposter. 每3题投票一次。</li>
     <li>Crew win by ejecting all imposters. Imposters win if the class gets 3 sabotages or they survive to the end. 找出全部卧底队员就赢。</li>
    </ol>
    <p class="muted" style="margin-bottom:0">Keep your role secret! 不要让别人看到你的身份！</p></div>
   <button class="btn ghost" id="lv" style="margin-top:6px">Leave 离开</button></div>`;
  $("#lv").onclick=async()=>{try{await DB.ref("imp/"+code+"/players/"+uid).remove();}catch(e){}clearSess();startScreen();};
}
function showRoleCard(){
  const r=myRole(),imp=r==="I";snd("drum");setTimeout(()=>snd(imp?"imp":"role"),1100);
  const n=G.cfg.nImp||1;
  $("#ovl").innerHTML=`<div class="ov"><div class="card fade">
    <div class="muted">Your secret role 你的秘密身份</div>
    <div class="emoji">${imp?"🕵️":"👨‍🚀"}</div>
    <div class="role ${imp?"imp":"crew"}">${imp?"IMPOSTER 卧底":"CREW 队员"}</div>
    ${imp?`<p>You will get <b>fake hints</b>. Push the class towards the wrong answer, but don't get caught! 你会拿到假提示，带大家答错，但别被发现！</p>`
         :`<p>You get <b>real hints</b>. Answer correctly and find the ${n>1?n+" imposters":"imposter"}! 你拿到真提示，答对题并找出卧底！</p>`}

}
function hintBox(q){
  const imp=myRole()==="I"&&!isOut(uid);
  if(imp)return `<div class="hint fake"><b>🔪 Your FAKE hint 假提示</b><br>${esc(q[5])}<div class="zh">${esc(q[6])}</div>
     <div style="margin-top:6px">Try to make the class choose <b style="color:var(--imp)">${L[q[7]]}. ${esc(q[1][q[7]])}</b>. 引导大家选 ${L[q[7]]}。</div></div>`;
  return `<div class="hint"><b>🛰️ Mission hint 任务提示</b><br>${esc(q[3])}<div class="zh">${esc(q[4])}</div>
     <div class="muted" style="margin-top:6px;font-size:14px">Careful: imposters have different hints and will try to trick you. 小心卧底误导你。</div></div>`;
}
function renderQ(){
  const q=curQ();
  app.innerHTML=`<div class="card fade">${header()}</div>
   <div class="card fade"><div class="q">${qText(q)}</div>
    <div class="opts">${q[1].map((o,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}.</b>${esc(o)}</button>`).join("")}</div>
    ${hintBox(q)}
    <div class="muted" id="st">Discuss with the class, then tap your answer. You can change it until time is up. 讨论后点选答案，时间到之前可以改。</div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{snd("tap");const i=+b.dataset.i;
    DB.ref(`imp/${code}/players/${uid}/a/${G.st.r}`).set(i).catch(()=>withAuth(()=>DB.ref(`imp/${code}/players/${uid}/a/${G.st.r}`).set(i)));
    G.players[uid].a=G.players[uid].a||{};G.players[uid].a[G.st.r]=i;markSel();});
  markSel();
}
function myAns(){const a=me().a;if(!a)return undefined;const v=a[G.st.r];return v==null?undefined:v;}
function markSel(){const v=myAns();app.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",+b.dataset.i===v));
  const s=$("#st");if(s&&v!=null)s.innerHTML=`✅ Locked in: <b>${L[v]}</b>. You can still change it. 已选择，还可以改。`;}
function renderResult(){
  const q=curQ(),r=G.st.r,v=myAns(),ok=v===q[2];
  if(v!=null)snd(ok?"ok":"bad");setTimeout(()=>snd(G.st.hit?"sab":"safe"),700);
  const by=[[],[],[],[]],none=[];
  for(const [id,p] of Object.entries(G.players||{})){const a=p.a&&p.a[r];if(a==null)none.push(p.name);else by[a].push(p.name);}
  const hit=G.st.hit;
  app.innerHTML=`<div class="card fade">${header()}</div>
   <div class="card fade"><div class="q">${qText(q)}</div>
    <div class="opts">${q[1].map((o,i)=>`<button class="opt ${i===q[2]?"right":(i===v?"wrong":"")}" disabled><b>${L[i]}.</b>${esc(o)}</button>`).join("")}</div>
    <div class="hint"><b>${v==null?"⏰ You didn't answer. 你没有作答。":ok?"✅ Correct! 答对了！":"❌ Not quite. 答错了。"}</b><br>Answer: <b>${L[q[2]]}. ${esc(q[1][q[2]])}</b><br>${esc(q[3])}<div class="zh">${esc(q[4])}</div></div>
    ${hit?`<div class="hint fake"><b>💥 Sabotage! 破坏成功！</b> Most of the crew chose a wrong answer. 大部分队员答错了。</div>`:`<div class="muted">🛡️ The crew defended this round. 队员守住了这一轮。</div>`}
   </div>
   <div class="card fade"><b>🔍 Who chose what? 谁选了什么？</b><div class="zh">Look for clues: who pushed the wrong answer? 想想谁在误导大家？</div>
    ${by.map((ns,i)=>`<div class="who"><b>${L[i]}</b> ${esc(q[1][i])} ${i===q[2]?"✅":""}: <span class="names">${ns.length?ns.map(esc).join(", "):"-"}</span></div>`).join("")}
    ${none.length?`<div class="who"><b>?</b> No answer: <span class="names">${none.map(esc).join(", ")}</span></div>`:""}
    <p class="muted" style="margin-bottom:0">${voteDue(r)?"🚨 Emergency meeting next: get ready to vote! 马上投票！":"➡️ Next question coming… 下一题马上开始…"}</p></div>`;
}
function marks(id){const r=G.st.r,a=(G.players[id]||{}).a||{};let out="";for(let k=Math.max(0,r-vE()+1);k<=r;k++){const v=a[k];out+=v==null?"⬜":(v===QS[G.cfg.qs[k]][2]?"✅":"❌");}return out;}
function myVote(){const v=me().v;return v?v[G.st.r]:undefined;}
function renderVote(){

   <div class="card fade center"><div class="emoji">🚨</div><h2>Emergency meeting! 紧急会议！</h2>

    <p class="muted" style="font-size:14px">✅❌ = each player's answers in the last ${Math.min(vE(),G.st.r+1)} question(s). 最近几题的对错。</p>

function markVote(){const v=myVote();app.querySelectorAll(".vbtn").forEach(b=>b.classList.toggle("sel",b.dataset.v===v));

function renderEject(){

   <div class="card fade center">${ej?`<div class="ejectfx">🧑‍🚀</div><h2>${meOut?"You were":esc(pname(ej))+" was"} ejected! 被淘汰！</h2>

    :`<div class="emoji">🤷</div><h2>No one was ejected. 没有人被淘汰。</h2><p class="muted">It was a tie, or most people skipped. 平票或大多数人跳过。</p>`}

function tallyHTML(){
  const r=G.st.r,c={};let skip=0;
  for(const [id,p] of Object.entries(G.players||{})){const v=p.v&&p.v[r];if(!v)continue;if(v==="skip")skip++;else c[v]=(c[v]||0)+1;}
  const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  if(!rows.length&&!skip)return `<p class="muted">No votes. 没有人投票。</p>`;
  return `<div style="text-align:left;max-width:360px;margin:0 auto">${rows.map(([id,n])=>`<div class="who">🗳️ ${esc(pname(id))}: <b>${n}</b></div>`).join("")}${skip?`<div class="who">⏭️ Skip: <b>${skip}</b></div>`:""}</div>`;
}

      <p style="margin-top:12px">You were ${imp?`an <b style="color:var(--imp)">IMPOSTER</b>`:`<b style="color:var(--crew)">CREW</b>`}. 你是${imp?"卧底":"队员"}。</p></div>`;
  }else rev=`<div class="card center muted fade">⏳ Waiting for the teacher to reveal the roles… 等待老师揭晓身份…</div>`;
  app.innerHTML=`<div class="card center fade"><div class="emoji">${win==="crew"?"🏆":none?"🏁":"🕵️"}</div>
    <h1 style="color:${win==="crew"?"var(--crew)":none?"var(--gold)":"var(--imp)"}">${win==="crew"?"CREW WINS! 队员胜利！":none?"MISSION ENDED 任务结束":"IMPOSTERS WIN! 卧底胜利！"}</h1>
    <p>${why}</p>
    ${st.reveal&&!none?`<h2>${iWon?"🎉 Your team won! 你的队伍赢了！":"😅 Your team lost this time. 这次输了。"}</h2>`:""}
    <p>Your answers 你的答题: <b>${correct}</b> correct out of <b>${played(G)}</b> rounds (${answered} answered)</p></div>
    ${rev}
    <div class="center"><button class="btn ghost" id="nx">Join another game 加入新游戏</button></div>`;
  $("#nx").onclick=()=>{code=null;saveSess();roleSeen=false;startScreen();};
}
// timer
setInterval(()=>{const t=$("#tm");if(!t||!G||!G.st)return;const st=G.st;
  if((st.ph==="q"||st.ph==="vote"||st.ph==="result")&&st.until){const s=Math.max(0,Math.ceil((st.until-now())/1000));t.textContent="⏱ "+s+"s";t.classList.toggle("low",s<=10);if(s<=5&&s>0&&t.dataset.l!=s){t.dataset.l=s;snd("tick");}}
  else t.textContent="";},250);
// boot
soundButton(false);
(async()=>{const s=loadSess();
  if(s&&s.code){try{uid=await freshAuth(false);const g=(await withAuth(()=>DB.ref("imp/"+s.code).get())).val();
    if(g&&g.players&&g.players[AUTH.currentUser.uid]&&g.status!=="end"){uid=AUTH.currentUser.uid;code=s.code;myName=s.name;roleSeen=g.status==="live";watch();return;}}catch(e){}}
  startScreen();})();
</script></body></html>
